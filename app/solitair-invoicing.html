function recalcLine(tr){
  if(!tr) return;
  var lid = tr.dataset.lid;
  var rateEl = tr.querySelector('[data-f="rate"]');
  var qtyEl = tr.querySelector('[data-f="qty"]');
  var minEl = tr.querySelector('[data-f="min"]');
  var vatEl = tr.querySelector('[data-f="vat"]');
  var totalEl = tr.querySelector('[data-f="total"]');
  var chargeEl = tr.querySelector('[data-f="charge"]');
  if(!rateEl || !qtyEl || !minEl || !totalEl || !chargeEl) return;
  var rate = num(rateEl.value);
  var qty  = num(qtyEl.value);
  var min  = num(minEl.value);
  var vat  = num(vatEl ? vatEl.value : 0) || 0;
  var total = rate * qty;
  var charge = qty > 0 ? Math.max(total, min) : 0;
  var vatAmt = charge * (vat / 100);
  var chargeWithVat = charge + vatAmt;
  totalEl.textContent = money(total);
  chargeEl.textContent = money(chargeWithVat);
}

/* Payment amounts. A single-method mode takes its amount as typed (0 included);
   left blank, the whole total. Cash + Card takes both amounts as typed. The
   amount is what the Invoice Register records; the printed advice always shows
   the full charges, so an amount that differs needs a reason (saveAdvice). */
var PAY_FIELD = {"Cash":"cash", "Card":"card", "Credit":"credit", "CASS":"cass", "Bank Transfer":"bank"};
function payHint(p, pm){
  ["cash","card","credit","cass","bank"].forEach(function(k){
    var el = $(p+"_pay_"+k);
    if(el) el.placeholder = PAY_FIELD[pm] === k ? "Blank = full total" : "0.00";
  });
}

function recalcAll(prefix){
  var tbody = prefix ? $(prefix+"_lines") : ($("a_lines") || $("i_lines"));
  if(!tbody) return;
  var total = 0;
  Array.from(tbody.querySelectorAll("tr[data-lid]")).forEach(function(tr){
    recalcLine(tr);
    var c = num(tr.querySelector('[data-f="charge"]').textContent);
    total += c;
  });
  var totalEl = prefix ? $(prefix+"_total") : ($("a_total") || $("i_total"));
  if(totalEl) totalEl.textContent = money(total);
}

function collectAdvice(mode){
  var isExp = mode==="export";
  var p = (isExp?"a":"i");
  var custEl = $(p+"_cust");
  var cust = custEl ? custEl.value.trim() : "";
  var c = resolveCustomer(cust);
  var trn = c ? c.trn : "";
  var country = c ? c.country : "";
  var paymode = c ? c.pay : "";
  /* if the hidden paymode field was set by payment button, use that; else fall back to customer's */
  var payBtnVal = $(p+"_paymode").value;
  if(payBtnVal) paymode = payBtnVal;

  var billTo = $(p+"_bill").value.trim();
  var billTrn = $(p+"_bill_trn").value.trim();
  var billAddr = $(p+"_bill_addr").value.trim();

  /* gather charge lines */
  var tbody = $(p+"_lines");
  var items = [];
  var total = 0;
  if(tbody){
    Array.from(tbody.querySelectorAll("tr[data-lid]")).forEach(function(tr){
      var desc = tr.querySelector('[data-f="desc"]');
      var rate = num(tr.querySelector('[data-f="rate"]').value);
      var qty  = num(tr.querySelector('[data-f="qty"]').value);
      var min  = num(tr.querySelector('[data-f="min"]').value);
      var vat  = num(tr.querySelector('[data-f="vat"]').value) || 0;
      var lineTotal = rate * qty;
      var charge = qty > 0 ? Math.max(lineTotal, min) : 0;
      var vatAmt = charge * (vat / 100);
      var chargeWithVat = charge + vatAmt;
      /* only applicable (actually-charged) lines are saved to the record
         and shown on the printed invoice - a line left at quantity 0
         never appears */
      if(chargeWithVat <= 0) return;
      items.push({
        d: desc && desc.value ? desc.value.trim() : ((tr.querySelector('.descname') || tr.querySelector('.desc')).textContent || "Custom line"),
        kind: "qty",
        qty: qty,
        rate: rate,
        total: lineTotal,
        min: min,
        charge: chargeWithVat,
        minApplied: lineTotal < min,
        vat: vat,
        rem: ""
      });
      total += chargeWithVat;
    });
  }

  /* payment breakdown */
  var pay = {
    cash: num($(p+"_pay_cash").value),
    card: num($(p+"_pay_card").value),
    credit: num($(p+"_pay_credit").value),
    cass: num($(p+"_pay_cass").value),
    bank: num($(p+"_pay_bank").value),
    prepaid: 0
  };

  if(paymode === "Cash + Card"){
    /* zero out other payment fields - cash/card values already came
       straight from the Payment Breakdown fields above */
    pay.credit = 0; pay.cass = 0; pay.bank = 0;
  } else if(PAY_FIELD[paymode]){
    /* a single method: the amount typed is kept as entered, 0 included; left
       blank, it is the total. Every other method is zeroed. */
    var typed = $(p+"_pay_"+PAY_FIELD[paymode]).value.trim(), amount = typed === "" ? total : num(typed);
    pay = {cash:0, card:0, credit:0, cass:0, bank:0, prepaid:0};
    pay[PAY_FIELD[paymode]] = amount;
  } else {
    /* auto-distribute: if only one payment method has value, use it */
    var nonZero = [];
    if(pay.cash > 0) nonZero.push("cash");
    if(pay.card > 0) nonZero.push("card");
    if(pay.credit > 0) nonZero.push("credit");
    if(pay.cass > 0) nonZero.push("cass");
    if(pay.bank > 0) nonZero.push("bank");
    if(nonZero.length === 0 && total > 0){
      /* default: put everything in cash */
      pay.cash = total;
    } else if(nonZero.length === 1){
      /* single payment method - set it to total */
      var k = nonZero[0];
      pay[k] = total;
    }
  }

  return {
    mode: isExp ? "Export" : "Import",
    ref: $(p+"_ref") ? $(p+"_ref").value : previewRef(mode),
    date: ymd(new Date()),
    ts: new Date().toISOString(),
    cust: cust,             /* the AWB owner - Register, Dashboard and Handover report on this */
    cust_trn: trn,
    cust_country: country,
    cust_paymode: paymode,
    billTo: billTo,         /* who the advice is invoiced to; its TRN and address print */
    billTrn: billTrn,
    billAddr: billAddr,
    /* the billing TRN and address again under their earlier names, so a backup
       taken on this version still prints correctly if restored into an earlier one */
    acct: billTrn,
    addr: billAddr,
    mawb: $(p+"_mawb").value.trim().toUpperCase(),
    hawb: $(p+"_hawb").value.trim().toUpperCase(),
    hawbqty: num($(p+"_hawbqty") ? $(p+"_hawbqty").value : 0),
    org: $(p+"_org").value.trim().toUpperCase() || (isExp?"DWC":"KHI"),
    dst: $(p+"_dst").value.trim().toUpperCase() || (isExp?"NBO":"DWC"),
    nog: $(p+"_nog").value.trim(),
    shc: $(p+"_shc").value,
    fltno: $(p+"_fltno").value.trim(),
    t1: $(p+"_t1").value,
    t2: $(p+"_t2").value,
    ata: "",
    wt: num($(p+"_wt").value),
    pcs: num($(p+"_pcs").value),
    items: items,
    total: total,
    payMode: paymode,
    pay: pay,
    txn: $(p+"_txn").value.trim(),
    rem: $(p+"_rem").value.trim(),
    /* kept only when the amounts really differ from the total */
    payReason: Math.abs(pay.cash + pay.card + pay.credit + pay.cass + pay.bank - total) > 0.01 && $(p+"_pay_reason")
      ? $(p+"_pay_reason").value.trim() : "",
    rcvby: $(p+"_rcvby").value.trim(),
    cls: shcClass($(p+"_shc").value),
    storageOverride: false,
    ovReason: "",
    hardcopy: false,
    staff: DB.staff || CFG.staff[0]
  };
}

/** Why an advice cannot be previewed, printed or saved yet, or "" when it can.
    Besides the required fields, this blocks an AWB that belongs to a shipment
    of the other direction in the Shipment Database: export and import advices
    price from different tariffs. It is checked here, at the moment of saving,
    so an AWB typed before the manifest was loaded is caught too. An AWB that is
    not in the Shipment Database cannot be checked and is not blocked. */
function adviceProblem(e){
  if(!e.mawb) return "AWB # is required";
  var shipment = shFind(e.mawb, false), dir = shipment ? shDirection(shipment) : "";
  if(dir && dir !== e.mode)
    return "AWB " + shipment.awb + " is an " + dir.toLowerCase() + " shipment. Raise it on the " + dir + " Advice.";
  if(!e.cust) return "AWB owner is required";
  if(!e.t1) return (e.mode === "Export" ? "Acceptance time & date (RCS)" : "RCF time & date") + " is required";
  if(!e.t2) return (e.mode === "Export" ? "Departure time & date" : "Delivery time & date") + " is required";
  if(!e.billTo) return "Billing party is required";
  return "";
}

function saveAdvice(mode){
  var e = collectAdvice(mode), problem = adviceProblem(e);
  if(problem){ toast(problem,"err"); return; }
  if(!e.wt || !e.pcs){ toast("Weight and pieces are required","err"); return; }

  /* validate charge lines */
  if(e.items.length === 0){ toast("Add at least one charge line","err"); return; }

  /* the amounts typed are what the Invoice Register records, while the advice
     prints the full charges - so amounts that differ from the total need a reason */
  var payPrefix = mode==="export" ? "a" : "i";
  if(e.payMode === "Cash + Card" && !$(payPrefix+"_pay_cash").value.trim() && !$(payPrefix+"_pay_card").value.trim()){
    toast("Enter the cash and card amounts","err");
    return;
  }
  var payTotal = e.pay.cash + e.pay.card + e.pay.credit + e.pay.cass + e.pay.bank, payNote = "";
  if(Math.abs(payTotal - e.total) > 0.01){
    if(!e.payReason){
      toast(e.payMode+" AED "+money(payTotal)+" differs from the total AED "+money(e.total)+". Give the reason.","err");
      $(payPrefix+"_pay_reason").focus();
      return;
    }
    payNote = "  |  "+e.payMode+" AED "+money(payTotal)+" against charges AED "+money(e.total);
  }

  /* assign ref if not set */
  if(!e.ref || e.ref === previewRef(mode)){
    DB.seq[mode] = (DB.seq[mode]||0) + 1;
    e.ref = refFor(DB.seq[mode]);
  }

  e.id = "INV_" + Date.now() + "_" + Math.floor(Math.random()*10000);
  e.staff = e.staff || DB.staff || CFG.staff[0];
  e.type = "invoice";

  DB.entries.push(e);
  save();
  toast("Invoice saved: "+e.ref+"  |  "+e.cust+"  |  AED "+money(e.total)+payNote,"ok");

  /* refresh register + lying list (export auto-join) */
  if(typeof buildRegister === "function") buildRegister();
  if(typeof renderRegister === "function") renderRegister();
  if(typeof llSyncFromRegister === "function") llSyncFromRegister();
  if(typeof renderLying === "function") renderLying();
  if(typeof refreshChip === "function") refreshChip();

  /* reset form */
  var pg = $("p-"+(mode==="export"?"export":"import"));
  if(pg){
    pg.innerHTML = "";
    buildAdvice(mode);
  }
}

function filteredEntries(){
  var f = {
    from:($("#rf_from")||{}).value||"", to:($("#rf_to")||{}).value||"",
    type:($("#rf_type")||{}).value||"", pay:($("#rf_pay")||{}).value||"",
    staff:($("#rf_staff")||{}).value||"", q:(($("#rf_q")||{}).value||"").toLowerCase()
  };
  return DB.entries.filter(function(e){
    if(f.from && e.date < f.from) return false;
    if(f.to   && e.date > f.to)   return false;
    if(f.type && (e.type!=="invoice" || e.mode!==f.type)) return false;
    if(f.pay  && (e.type!=="invoice" || e.payMode!==f.pay)) return false;
    if(f.staff && e.staff!==f.staff) return false;
    if(f.q){
      var hay = [e.mawb,e.hawb,e.cust,e.ref,e.rem,e.payReason,e.note].join(" ").toLowerCase();
      if(hay.indexOf(f.q)<0) return false;
    }
    return true;
  });
}

function renderRegister(){
  var regtblEl = $("regtbl"); var tb = regtblEl ? regtblEl.querySelector("tbody") : null; if(!tb) return;
  var bal = num(DB.openingBalance);
  var rows = [];

  /* opening row */
  rows.push('<tr class="opening"><td>'+esc(DB.openingDate?fmtD(DB.openingDate):"")+'</td><td></td><td></td><td></td>'
    +'<td>OPENING BALANCE</td><td></td><td class="n"></td><td class="n"></td><td class="n">'+money(bal)+'</td>'
    +'<td class="n"></td><td class="n"></td><td class="n"></td><td class="n"></td><td class="n"></td>'
    +'<td>'+esc(DB.openingNote||"")+'</td><td></td><td></td></tr>');

  var shown = filteredEntries();
  var shownIds = {}; shown.forEach(function(e){ shownIds[e.id]=1; });
  var out=[], tot={cash:0,card:0,credit:0,cass:0,bank:0,sales:0,handed:0,n:0};

  DB.entries.forEach(function(e){
    if(e.type==="handover") bal -= num(e.amount);
    else bal += num(e.pay.cash);
    if(!shownIds[e.id]) return;

    if(e.type==="handover"){
      tot.handed += num(e.amount);
      out.push('<tr class="handover" data-id="'+e.id+'"><td>'+esc(fmtD(e.date))+'</td><td></td><td></td><td></td>'
        +'<td>CASH HANDED TO ACCOUNTS</td><td>'+esc(e.staff||"")+'</td>'
        +'<td class="n"></td><td class="n">'+money(e.amount)+'</td><td class="n">'+money(bal)+'</td>'
        +'<td class="n"></td><td class="n"></td><td class="n"></td><td class="n"></td><td class="n"></td>'
        +'<td>'+esc(e.note||"")+'</td><td></td>'
        +'<td><button class="btn sm dgr" data-del="'+e.id+'">Del</button></td></tr>');
      return;
    }
    tot.cash+=num(e.pay.cash); tot.card+=num(e.pay.card); tot.credit+=num(e.pay.credit);
    tot.cass+=num(e.pay.cass); tot.bank+=num(e.pay.bank); tot.sales+=num(e.total); tot.n++;
    var pb = {"Cash":"b-cash","Card":"b-card","Cash + Card":"b-mix","Credit":"b-credit","CASS":"b-cass","Bank Transfer":"b-bank","Prepaid":"b-bank"}[e.payMode]||"b-mix";
    out.push('<tr data-id="'+e.id+'"><td>'+esc(fmtD(e.date))+'</td><td>'+esc(e.ref)+'</td><td>'+esc(e.mawb)+'</td>'
      +'<td><span class="badge '+(e.mode==="Export"?"b-exp":"b-imp")+'">'+esc(e.mode)+'</span></td>'
      +'<td>'+esc(e.cust)+'</td><td>'+esc(e.staff)+'</td>'
      +'<td class="n">'+(e.pay.cash?money(e.pay.cash):"")+'</td><td class="n"></td>'
      +'<td class="n">'+money(bal)+'</td>'
      +'<td class="n">'+(e.pay.card?money(e.pay.card):"")+'</td>'
      +'<td class="n">'+(e.pay.credit?money(e.pay.credit):"")+'</td>'
      +'<td class="n">'+(e.pay.cass?money(e.pay.cass):"")+'</td>'
      +'<td class="n">'+(e.pay.bank?money(e.pay.bank):"")+'</td>'
      +'<td class="n"><b>'+money(e.total)+'</b></td>'
      /* Remarks is cut to 250px on screen; the tooltip carries it in full */
      +'<td title="'+esc([e.rem, e.payReason ? "Amount differs from total: "+e.payReason : ""].filter(Boolean).join("  |  "))+'"><span class="badge '+pb+'">'+esc(e.payMode)+'</span> '+esc(e.rem||"")+(e.payReason?' <i>Amount differs from total: '+esc(e.payReason)+'</i>':'')+(e.storageOverride?' <b style="color:#b8860b">OVR</b>':'')+'</td>'
      +'<td style="text-align:center"><span class="'+(e.hardcopy?"tick":"cross")+'" data-hc="'+e.id+'" style="cursor:pointer" title="Toggle hard copy received">'+(e.hardcopy?"&#10003;":"&#9675;")+'</span></td>'
      +'<td><button class="btn sm" data-print="'+e.id+'">Print</button> <button class="btn sm dgr" data-del="'+e.id+'">Del</button></td></tr>');
  });

  rows = rows.concat(out);
  tb.innerHTML = rows.join("");
  $("#regsum").innerHTML = '<b>'+tot.n+'</b> invoices shown &nbsp;|&nbsp; Sales <b>AED '+money(tot.sales)
    +'</b> &nbsp;|&nbsp; Cash '+money(tot.cash)+' &nbsp;|&nbsp; Card '+money(tot.card)
    +' &nbsp;|&nbsp; Credit '+money(tot.credit)+' &nbsp;|&nbsp; CASS '+money(tot.cass)
    +' &nbsp;|&nbsp; Bank '+money(tot.bank)+' &nbsp;|&nbsp; Handed over '+money(tot.handed);

  $$("[data-del]", tb).forEach(function(b){
    b.onclick=function(){
      var id=b.dataset.del;
      modal("Delete entry?","<p>This removes the entry and recalculates every balance after it. This cannot be undone.</p>",
        [{label:"Cancel"},{label:"Delete", cls:"dgr", fn:function(){
          DB.entries = DB.entries.filter(function(x){ return x.id!==id; });
          /* also drop the lying-list entry that was auto-added for this invoice
             (id "LLA"+invoiceId) - from both the live list and the cleared history -
             so deleting a mistaken invoice doesn't leave a stale/duplicate entry
             behind, and re-saving a corrected invoice for the same AWB can rejoin cleanly */
          var llId = "LLA" + id;
          if(typeof LL !== "undefined" && LL){
            var beforeItems = LL.items.length, beforeCleared = LL.cleared.length;
            LL.items = LL.items.filter(function(x){ return x.id!==llId; });
            LL.cleared = LL.cleared.filter(function(x){ return x.id!==llId; });
            if(LL.items.length!==beforeItems || LL.cleared.length!==beforeCleared) llSave();
          }
          save(); refreshChip(); renderRegister(); renderDash();
          if(typeof renderLying === "function") renderLying();
          toast("Entry deleted");
        }}]);
    };
  });
  $$("[data-print]", tb).forEach(function(b){
    b.onclick=function(){ var e=DB.entries.filter(function(x){return x.id===b.dataset.print;})[0]; if(e) printAdvice(e,false); };
  });
  $$("[data-hc]", tb).forEach(function(s){
    s.onclick=function(){
      var e=DB.entries.filter(function(x){return x.id===s.dataset.hc;})[0];
      if(e){ e.hardcopy=!e.hardcopy; save(); renderRegister(); }
    };
  });
}

function dashRange(){

  if(p==="today") return {from:ymd(now), to:ymd(now)};
  if(p==="7"){ var a=new Date(now); a.setDate(a.getDate()-6); return {from:ymd(a), to:ymd(now)}; }
  if(p==="30"){ var b=new Date(now); b.setDate(b.getDate()-29); return {from:ymd(b), to:ymd(now)}; }
  if(p==="month") return {from:ymd(now).slice(0,8)+"01", to:ymd(now)};
  if(p==="custom") return {from:($("#d_from")||{}).value||"", to:($("#d_to")||{}).value||""};
  return {from:"", to:""};
}

function bars(sel, items){

function xesc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---- minimal, dependency-free .xlsx writer (stored ZIP + CRC32) ---- */
var CRCT = (function(){
  var t=new Uint32Array(256);
  for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c = (c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; }
  return t;
})();
function crc32(bytes){
  var c=0xFFFFFFFF;
  for(var i=0;i<bytes.length;i++) c = CRCT[(c^bytes[i])&0xFF] ^ (c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function zipBuild(files){
  var enc = new TextEncoder(), parts=[], central=[], offset=0;
  function u16(n){ return [n&255,(n>>8)&255]; }
  function u32(n){ return [n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255]; }
  files.forEach(function(f){
    var name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
    var lh = [].concat([0x50,0x4b,0x03,0x04], u16(20), u16(0x0800), u16(0), u16(0), u16(0),
                       u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0));
    parts.push(new Uint8Array(lh), name, data);
    central.push({name:name, crc:crc, size:data.length, off:offset});
    offset += lh.length + name.length + data.length;
  });
  var cdir=[], cdirLen=0;
  central.forEach(function(c){
    var h = [].concat([0x50,0x4b,0x01,0x02], u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
                      u32(c.crc), u32(c.size), u32(c.size), u16(c.name.length),
                      u16(0), u16(0), u16(0), u16(0), u32(0), u32(c.off));
    cdir.push(new Uint8Array(h), c.name);
    cdirLen += h.length + c.name.length;
  });
  var end = new Uint8Array([].concat([0x50,0x4b,0x05,0x06], u16(0), u16(0),
            u16(central.length), u16(central.length), u32(cdirLen), u32(offset), u16(0)));
  var all = parts.concat(cdir, [end]);
  var total = all.reduce(function(a,x){ return a+x.length; },0);
  var out = new Uint8Array(total), p=0;
  all.forEach(function(x){ out.set(x,p); p+=x.length; });
  return out;
}
function colName(i){ var s=""; i++; while(i>0){ var m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=(i-m-1)/26; } return s; }
function sheetXml(rows, widths, headerRow){
  var x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
        + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  if(widths && widths.length){
    x += '<cols>';

    x += '</cols>';

  rows.forEach(function(r,ri){

    r.forEach(function(c,ci){
      if(c===""||c==null) return;

      }

    x += '</row>';
  });
  return x + '</sheetData></worksheet>';
}

    {name:"xl/styles.xml", data:st}
  ];
  sheets.forEach(function(s,i){
    files.push({name:"xl/worksheets/sheet"+(i+1)+".xml", data:sheetXml(s.rows, s.widths)});
  });
  return zipBuild(files);
}

function exportExcel(list){
  var b = runningBalances();
  var bytes = buildXlsx([
    { name:"Invoice Register", rows:regRows(list),
      widths:[11,12,15,13,9,26,11,13,13,13,11,11,11,13,12,14,11,8,32,15] },
    { name:"Balances", rows:[
        ["Payment Method","Amount (AED)"],
        ["Cash on Hand", b.cash],
        ["Card Total", b.card],
        ["Credit Total", b.credit],
        ["CASS Total", b.cass],
        ["Bank Transfer Total", b.bank],
        ["Total Handed to Accounts", b.handed],
        ["Total Sales", b.sales],
        ["Invoice Count", b.count],
        ["Opening Float", num(DB.openingBalance)],
        ["Generated", fmtDT(new Date().toISOString())]
      ], widths:[28,16] }
  ]);
  var blob = new Blob([bytes], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="SolitAir_Invoice_Register_"+stamp()+".xlsx";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
  toast("Excel register exported", "ok");
}

function exportCsv(list){
  var rows = regRows(list);
  var csv = rows.map(function(r){
    return r.map(function(c){ var s=String(c==null?"":c); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(",");
  }).join("\r\n");
  dl("﻿"+csv, "SolitAir_Invoice_Register_"+stamp()+".csv", "text/csv");
  toast("CSV exported", "ok");
}

function dl(content, name, mime){
  var b = new Blob([content], {type:mime+";charset=utf-8"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* the SHC reference under Rates & Data, rebuilt whenever the free-hour rules are saved */
function shcReference(){
  var h = '<p class="hint" style="margin-top:0">The SHC code on the advice sets the billing class and the free storage window. '
     + shcCodesOf("general")+' bill as general cargo, '+CFG.freeHours.general+' hrs free. '
     + 'Perishables ('+shcCodesOf("perishable")+') bill as perishable cargo, '+CFG.freeHours.perishable+' hrs free. '
     + 'Every other code, including one not in this list, bills as special cargo, '+CFG.freeHours.special+' hrs free. '
     + 'Where a shipment carries several codes, any perishable code makes it perishable, and any code other than '+shcCodesOf("general")+' makes it special.</p>'
     + '<table class="reg"><thead><tr><th>Code</th><th>Description</th><th>Bills As</th><th class="r">Free Storage</th></tr></thead><tbody>';
  CFG.shcCodes.forEach(function(s){
    var cls = s.k==="general" ? "General Cargo" : (s.k==="perishable" ? "Perishable" : "Special Cargo");
    var fr  = CFG.freeHours[s.k] + " hrs";
    h += '<tr><td><b>'+s.c+'</b></td><td>'+esc(s.d)+'</td><td>'+cls+'</td><td class="r">'
       + (s.k==="perishable" ? '<b style="color:var(--err)">'+fr+'</b>' : fr) + '</td></tr>';
  });
  return h + '</tbody></table>';
}

function rateTable(lines, pfx){
  var h = '<table class="chg"><thead><tr><th style="text-align:left">Service Description</th>'
        + '<th style="width:110px">Rate (AED)</th><th style="width:110px">Minimum (AED)</th><th style="width:70px">Basis</th></tr></thead><tbody>';
  lines.forEach(function(l){
    if(l.g){ h += '<tr class="grp"><td colspan="4">'+esc(l.g)+'</td></tr>'; return; }
    if(l.kind==="days" || l.kind==="misc"){
      h += '<tr><td class="desc">'+esc(l.d)+'</td><td class="num">-</td><td class="num">-</td><td class="num">'+(l.kind==="days"?"days":"manual")+'</td></tr>';
      return;
    }
    var basis = l.kind==="kg" ? "per kg" : (l.kind==="storage" ? "kg/day" : (l.unit||"each"));
    h += '<tr><td class="desc">'+esc(l.d)+'</td>'
       + '<td><input class="qty" type="number" step="0.001" value="'+l.rate+'" data-r="'+l.id+'" data-f="rate"></td>'
       + '<td><input class="qty" type="number" step="0.01" value="'+l.min+'" data-r="'+l.id+'" data-f="min"></td>'
       + '<td class="num">'+basis+'</td></tr>';
  });
  return h+'</tbody></table>';
}

function applyRateOverrides(){
  if(!DB.rates) return;
  EXPORT_LINES.concat(IMPORT_LINES).forEach(function(l){
    if(l.g || !DB.rates[l.id]) return;
    if(DB.rates[l.id].rate!=null) l.rate = DB.rates[l.id].rate;
    if(DB.rates[l.id].min!=null)  l.min  = DB.rates[l.id].min;
  });
}

  h += fld("To", '<input id="ho_to" type="datetime-local">');

function heldPanel(pfx, title){
  return '<div class="panel"><h3>'+title+'</h3><div class="body">'
    + '<table class="chg" id="'+pfx+'_tbl"><thead><tr><th style="text-align:left">AWB #</th><th style="width:64px">Pcs</th>'
    + '<th style="width:74px">Weight</th><th style="text-align:left">Held Due To</th><th style="width:52px"></th></tr></thead><tbody></tbody></table>'
    + '<div class="btnbar" style="margin-top:8px"><button class="btn sm" data-add="'+pfx+'">Add Held Shipment</button></div></div></div>';
}
function heldRows(pfx){
  return $$("#"+pfx+"_tbl tbody tr").map(function(tr){
    var i=$$("input",tr);
    return {awb:i[0].value.trim(), pcs:i[1].value.trim(), wt:i[2].value.trim(), due:i[3].value.trim()};
  }).filter(function(r){ return r.awb||r.due; });
}
function heldRender(pfx, rows){
  var tb = $("#"+pfx+"_tbl tbody"); if(!tb) return;
  tb.innerHTML = rows.map(function(r){
    return '<tr><td><input class="qty" style="text-align:left" value="'+esc(r.awb||"")+'"></td>'
      + '<td><input class="qty" value="'+esc(r.pcs||"")+'"></td>'
      + '<td><input class="qty" value="'+esc(r.wt||"")+'"></td>'
      + '<td><input class="qty" style="text-align:left" value="'+esc(r.due||"")+'"></td>'
      + '<td><button class="btn sm dgr" data-rm="1">X</button></td></tr>';
  }).join("");
  $$("[data-rm]", tb).forEach(function(b){
    b.onclick = function(){ var tr=b.closest("tr"); tr.parentNode.removeChild(tr); };
  });
}
document.addEventListener("click", function(ev){
  var b = ev.target.closest ? ev.target.closest("[data-add]") : null;
  if(!b) return;
  var p = b.dataset.add;
  heldRender(p, heldRows(p).concat([{awb:"",pcs:"",wt:"",due:""}]));
});

function eqRead(){
  return $$("#ho_eq tbody tr").map(function(tr){
    var i=$$("input",tr); return {n:i[0].value.trim(), s:i[1].value.trim()};
  }).filter(function(r){ return r.n; });
}
function eqRender(list){
  var hoEqEl=$("ho_eq"); var tb = hoEqEl ? hoEqEl.querySelector("tbody") : null; if(!tb) return;
  tb.innerHTML = list.map(function(e){
    return '<tr><td><input class="qty" style="text-align:left" value="'+esc(e.n)+'"></td>'
      + '<td><input class="qty" style="text-align:left" value="'+esc(e.s)+'"></td>'
      + '<td><button class="btn sm dgr" data-eqrm="1">X</button></td></tr>';
  }).join("");
  $$("[data-eqrm]", tb).forEach(function(b){
    b.onclick=function(){ var tr=b.closest("tr"); tr.parentNode.removeChild(tr); DB.equipment=eqRead(); save(); };
  });
  $$("input", tb).forEach(function(i){ i.onchange=function(){ DB.equipment=eqRead(); save(); }; });
}

function syncShiftWindow(){
  var k = $("#ho_shift").value; if(k==="custom") return;
  var d = $("#ho_d").value; if(!d) return;
  var s = SHIFTS[k];
  $("#ho_from").value = d+"T"+s.s;
  if(s.e==="24:00"){
    var nx=new Date(d+"T00:00"); nx.setDate(nx.getDate()+1);
    $("#ho_to").value = ymd(nx)+"T00:00";
  } else {
    $("#ho_to").value = d+"T"+s.e;
  }
  if(!$("#ho_time").value) $("#ho_time").value = s.e==="24:00" ? "00:00" : s.e;
}

/* gathers every figure the report needs out of the register */
function handoverFigures(){
  var from = $("#ho_from").value, to = $("#ho_to").value, who = $("#ho_out").value;
  var a = from ? new Date(from).getTime() : -Infinity;
  var b = to   ? new Date(to).getTime()   :  Infinity;

  var openCash = num(DB.openingBalance), inWin = [];
  DB.entries.forEach(function(e){
    var t = new Date(e.ts).getTime();
    if(t < a){ openCash += (e.type==="handover" ? -num(e.amount) : num(e.pay.cash)); return; }
    if(t > b) return;
    inWin.push(e);
  });

  function blank(){ return {awb:0, pcs:0, wt:0}; }
  var F = {
    imp:{tot:blank(), spc:blank(), per:blank()},
    exp:{tot:blank(), spc:blank(), per:blank()},
    cash:{takeover:openCash, cash:0, card:0, cass:0, credit:0, bank:0, sales:0, onhand:openCash, handed:0},
    handovers:[], byStaff:{}, invoices:[]
  };

  inWin.forEach(function(e){
    if(e.type==="handover"){
      if(who && e.staff!==who) { F.cash.onhand -= num(e.amount); return; }
      F.cash.handed += num(e.amount); F.cash.onhand -= num(e.amount);
      F.handovers.push(e); return;
    }
    if(who && e.staff!==who){ F.cash.onhand += num(e.pay.cash); return; }

    var g = e.mode==="Export" ? F.exp : F.imp;
    var cls = e.cls || shcClass(e.shc);
    function add(o){ o.awb++; o.pcs += num(e.pcs); o.wt += num(e.wt); }
    add(g.tot);
    if(cls==="perishable") add(g.per);
    else if(cls==="special") add(g.spc);

    F.cash.cash += num(e.pay.cash); F.cash.card += num(e.pay.card);
    F.cash.cass += num(e.pay.cass); F.cash.credit += num(e.pay.credit);
    F.cash.bank += num(e.pay.bank); F.cash.sales += num(e.total);
    F.cash.onhand += num(e.pay.cash);

    var s = F.byStaff[e.staff] = F.byStaff[e.staff] || {n:0, pcs:0, wt:0, cash:0, card:0, cass:0, credit:0, bank:0, tot:0};
    s.n++; s.pcs += num(e.pcs); s.wt += num(e.wt);
    s.cash += num(e.pay.cash); s.card += num(e.pay.card); s.cass += num(e.pay.cass);
    s.credit += num(e.pay.credit); s.bank += num(e.pay.bank); s.tot += num(e.total);
    F.invoices.push(e);
  });
  return F;
}

    return '<div class="panel"><h3>'+title+'</h3>'
      + '<table class="chg"><thead><tr><th style="text-align:left">Category</th><th style="width:90px">Total AWB</th>'
      + '<th style="width:90px">Total Pcs</th><th style="width:110px">Total Weight</th></tr></thead><tbody>'
      + '<tr class="act"><td><b>Total AWB</b></td>'+trio(g.tot)+'</tr>'
      + '<tr><td>Special Cargo AWB</td>'+trio(g.spc)+'</tr>'

  }

    var s=F.byStaff[k];
    return '<tr><td><b>'+esc(k)+'</b></td><td class="num">'+s.n+'</td><td class="num">'+s.pcs+'</td><td class="num">'+money(s.wt)+'</td>'
      + '<td class="num">'+money(s.cash)+'</td><td class="num">'+money(s.card)+'</td><td class="num">'+money(s.cass)+'</td>'
      + '<td class="num">'+money(s.credit)+'</td><td class="num">'+money(s.bank)+'</td><td class="num"><b>'+money(s.tot)+'</b></td></tr>';
  }).join("");

  var h = '<div class="grid" style="grid-template-columns:1fr 1fr">'
        + block("Delivery / Import", F.imp) + block("Acceptance / Export", F.exp) + '</div>';

  h += '<div class="panel" style="margin-top:10px"><h3>Payment Methods by Staff  (pieces and weight included)</h3>'
     + '<table class="chg"><thead><tr><th style="text-align:left">Staff</th><th style="width:70px">Invoices</th>'
     + '<th style="width:70px">Pieces</th><th style="width:90px">Weight</th><th style="width:90px">Cash</th>'
     + '<th style="width:90px">Card</th><th style="width:90px">CASS</th><th style="width:90px">Credit</th>'
     + '<th style="width:90px">Bank</th><th style="width:100px">Total Sales</th></tr></thead><tbody>'
     + (staffRows || '<tr><td colspan="10" style="color:var(--mut)">No invoices in this window.</td></tr>')
     + '</tbody></table></div>';

  h += '<div class="panel" style="margin-top:10px"><h3>Cash Handling</h3>'
     + '<table class="chg"><tbody>'
     + cashRow("Cash Take-Over (balance at shift start)", F.cash.takeover)
     + cashRow("Total Cash from Shift", F.cash.cash)
     + cashRow("Total Credit Card from Shift", F.cash.card)
     + cashRow("Total CASS from Shift", F.cash.cass)
     + cashRow("Total Credit Billing", F.cash.credit)
     + cashRow("Total Bank Transfer", F.cash.bank)
     + cashRow("Total Sales in Shift", F.cash.sales, 1)
     + cashRow("Cash Handed Over to Accounts", F.cash.handed)
     + cashRow("Cash on Hand at Handover", F.cash.onhand, 1)
     + '</tbody></table></div>';

  if(F.handovers.length){
    h += '<div class="panel" style="margin-top:10px"><h3>Cash Handed Over to Accounts</h3>'
       + '<table class="chg"><thead><tr><th style="text-align:left">Date</th><th style="width:90px">Time</th>'
       + '<th style="width:110px">Amount</th><th style="text-align:left">Handed Over To</th></tr></thead><tbody>'
       + F.handovers.map(function(e){
           var t=new Date(e.ts);
           return '<tr><td>'+esc(fmtD(e.date))+'</td><td class="num">'+pad(t.getHours())+':'+pad(t.getMinutes())+'</td>'
             + '<td class="num"><b>'+money(e.amount)+'</b></td><td>'+esc(e.note||"")+'</td></tr>';
         }).join("")
       + '</tbody></table></div>';
  }
  h += '<div class="panel" style="margin-top:10px"><h3>Cargo Lying List - Warehouse</h3><div class="body">'
     + '<table class="chg" style="width:100%">' + lyingBand(false).replace(/^<table[^>]*><tbody>/,"").replace(/<\/tbody><\/table>$/,"") + '</table></div></div>';

  $("#ho_figs").innerHTML = h;
  $("#ho_msg").innerHTML = '<b>'+F.invoices.length+'</b> invoices in window'+($("#ho_out").value?' for '+esc($("#ho_out").value):'');
}
function cashRow(l,v,strong){
  return '<tr'+(strong?' class="act"':'')+'><td>'+(strong?'<b>'+l+'</b>':l)+'</td>'
       + '<td class="num" style="width:150px">'+(strong?'<b>'+money(v)+'</b>':money(v))+'</td></tr>';
}

function handoverData(){
  var F = handoverFigures();
  return {
    id:"HR"+Date.now(),
    date:$("#ho_d").value, shift:$("#ho_shift").value,
    shiftLabel: SHIFTS[$("#ho_shift").value] ? SHIFTS[$("#ho_shift").value].l : "Custom window",
    from:$("#ho_from").value, to:$("#ho_to").value,
    outgoing:$("#ho_out").value || "All counter staff", incoming:$("#ho_in").value,
    time:$("#ho_time").value, sup:$("#ho_sup").value.trim(),
    points:$("#ho_points").value.trim(), summary:$("#ho_sum").value.trim(),
    m:{d1:num($("#ho_m1").value), d2:num($("#ho_m2").value),
       e1:num($("#ho_m3").value), e2:num($("#ho_m4").value), e3:num($("#ho_m5").value)},
    heldExp:heldRows("hx"), heldImp:heldRows("hm"),
    equipment:eqRead(), F:F
  };
}

function saveHandover(){
  var r = handoverData();
  DB.reports = DB.reports || [];
  DB.reports.push(r);
  DB.equipment = r.equipment;
  save(); renderSavedReports();
  toast("Handover report saved","ok");
}

function renderSavedReports(){
  var box=$("#ho_saved"); if(!box) return;
  var list=(DB.reports||[]).slice().reverse();
  if(!list.length){ box.innerHTML='<p class="hint" style="margin:0">No saved reports yet.</p>'; return; }
  box.innerHTML = '<table class="reg" style="white-space:normal"><thead><tr><th>Date</th><th>Shift</th>'
    + '<th>Outgoing</th><th>Incoming</th><th style="text-align:right">Sales</th><th style="text-align:right">Cash on Hand</th><th></th></tr></thead><tbody>'
    + list.map(function(r){
        return '<tr><td>'+esc(fmtD(r.date))+'</td><td>'+esc(r.shiftLabel)+'</td><td>'+esc(r.outgoing)+'</td>'
          + '<td>'+esc(r.incoming||"")+'</td><td class="n">'+money(r.F.cash.sales)+'</td>'
          + '<td class="n">'+money(r.F.cash.onhand)+'</td>'
          + '<td><button class="btn sm" data-rp="'+r.id+'">Print</button> '
          + '<button class="btn sm dgr" data-rd="'+r.id+'">Del</button></td></tr>';
      }).join("") + '</tbody></table>';
  $$("[data-rp]",box).forEach(function(b){
    b.onclick=function(){ var r=(DB.reports||[]).filter(function(x){return x.id===b.dataset.rp;})[0]; if(r) printHandover(r); };
  });
  $$("[data-rd]",box).forEach(function(b){
    b.onclick=function(){
      DB.reports=(DB.reports||[]).filter(function(x){ return x.id!==b.dataset.rd; });
      save(); renderSavedReports(); toast("Report deleted");
    };
  });
}

function buildLying(){

  h += '<p class="hint" style="margin-bottom:0">Export AWBs are added to this list automatically when their invoice is saved in the register.</p>';
  h += '</div></div>';

  h += '<div id="ll_alerts" style="margin-top:10px"></div>';

  h += '<div class="panel" style="margin-top:10px"><h3>Cargo Currently Lying in Warehouse</h3><div class="body">'
     + '<div class="regwrap"><table class="reg" id="ll_tbl"><thead><tr>'
     + '<th>AWB #</th><th>Pieces</th><th style="text-align:right">Weight (kg)</th>'
     + '<th>From / To</th><th>Flight</th><th>Departure (STD)</th>'
     + '<th>Status</th><th>Time to Departure</th><th></th></tr></thead><tbody></tbody></table></div>'

     + '</div></div>';

  h += '<div class="panel" style="margin-top:10px"><h3>Cleared by Departure (kept for reference)</h3><div class="body">'
     + '<div class="btnbar" style="margin-bottom:8px"><button class="btn sm dgr" id="ll_clrhist">Clear History</button><span class="hint" id="ll_sum"></span></div>'
     + '<table class="reg" id="ll_hist"><thead><tr><th>Cleared At</th><th>AWB #</th><th>Pieces</th>'
     + '<th style="text-align:right">Weight (kg)</th><th>Flight</th><th>Scheduled Departure</th></tr></thead><tbody></tbody></table>'
     + '</div></div>';

  $("#p-lying").innerHTML = h;

  $("#ll_add").onclick = function(){
    var awb=$("#ll_awb").value.trim(), pcs=num($("#ll_pcs").value), wt=num($("#ll_wt").value);
    var fltno=$("#ll_fltno").value.trim(), dep=$("#ll_dep").value;

    if(bad.length){ $("#ll_msg").innerHTML='<span style="color:#c0392b;font-weight:700">Fill AWB, pieces, weight, flight and departure time.</span>'; return; }

function llCommit(awb,pcs,wt,fltno,dep,dir,loc){
  dir = dir || "Export"; loc = loc || "";
  LL.items.push({
    id:"LL"+Date.now(), awb:awb, pcs:pcs, wt:wt,
    dir:dir, loc:(dir==="Export"?"TO ":"FROM ")+loc, fltno:fltno, dep:dep,
    addedBy:DB.staff||CFG.staff[0], addedTs:new Date().toISOString(), auto:false
  });
  llSave(); llSweep(); renderLying();
  ["ll_awb","ll_pcs","ll_wt","ll_loc","ll_fltno","ll_dep"].forEach(function(i){ $("#"+i).value=""; });
  toast(awb+" added to lying list - clears when "+fltno+" departs","ok");
}

/* ---- AUTO-SYNC: every export AWB invoiced in the register joins the lying list ---- */
function llSyncFromRegister(){
  var added=0;
  DB.entries.forEach(function(e){
    if(e.type!=="invoice" || e.mode!=="Export") return;
    var dup = LL.items.concat(LL.cleared).some(function(x){ return x.awb===e.mawb; });
    if(dup) return;
    /* departure = the advice's departure time if captured, otherwise flight date at 23:59 */
    var dep = e.t2 || (e.fltdate ? e.fltdate+"T23:59" : "");
    if(!dep) return;
    LL.items.push({
      id:"LLA"+e.id, awb:e.mawb, pcs:num(e.pcs), wt:num(e.wt),
      dir:"Export", loc:"TO "+(e.dst||""), fltno:e.fltno||"-", dep:dep,
      addedBy:e.staff||"", addedTs:e.ts||new Date().toISOString(), auto:true
    });
    added++;
  });
  if(added){ llSave(); }
  return added;
}

/* remove anything whose flight has departed */
function llSweep(){
  var now=Date.now(), kept=[], n=0;
  LL.items.forEach(function(it){
    var t=new Date(it.dep).getTime();
    if(t && t<=now){
      it.clearedAt=new Date().toISOString();
      LL.cleared.unshift(it); n++;
    } else kept.push(it);
  });
  if(n){ LL.items=kept; LL.cleared=LL.cleared.slice(0,300); llSave(); }
}

function llCountdown(dep){
  var ms=new Date(dep).getTime()-Date.now();
  if(ms<=0) return "departed";
  var m=Math.floor(ms/60000), hh=Math.floor(m/60), mm=m%60, dd=Math.floor(hh/24), hr=hh%24;
  if(dd>0) return dd+"d "+hr+"h";
  if(hh>0) return hh+"h "+mm+"m";
  return mm+"m";
}

function renderLying(){
  var tb=$("ll_tbl") ? $("ll_tbl").querySelector("tbody") : null;
  if(tb){
    llSyncFromRegister();
    llSweep();
    tb.innerHTML = LL.items.length ? "" : '<tr><td colspan="9" style="text-align:center;color:var(--mut)">No cargo lying in the warehouse.</td></tr>';
    LL.items.forEach(function(it){
      var hrs=(new Date(it.dep).getTime()-Date.now())/3600000;
      var status = hrs<8
        ? '<span class="badge" style="background:#c0392b">'+(hrs<2?"URGENT":"DEPARTING SOON")+'</span>'
        : '<span class="badge b-exp">LYING</span>';
      var dirTag = (it.loc||"").indexOf("FROM ")===0
        ? '<span class="badge b-imp">'+esc(it.loc||"")+'</span>'
        : '<span class="badge b-exp">'+esc(it.loc||"TO")+'</span>';
      tb.insertAdjacentHTML("beforeend",
        '<tr data-id="'+it.id+'"><td>'+esc(it.awb)+(it.auto?' <span class="hint" title="Added automatically from the register">&#9679;</span>':"")+'</td>'
        +'<td>'+it.pcs+'</td><td class="n">'+money(it.wt)+'</td>'
        +'<td>'+dirTag+'</td>'
        +'<td>'+esc(it.fltno)+'</td><td>'+fmtDT(it.dep)+'</td>'
        +'<td>'+status+'</td><td><b>'+llCountdown(it.dep)+'</b></td>'
        +'<td><button class="btn sm dgr" data-lldel="'+it.id+'">Remove</button></td></tr>');
    });
    $$("#ll_tbl [data-lldel]").forEach(function(b){
      b.onclick=function(){ LL.items=LL.items.filter(function(x){ return x.id!==b.dataset.lldel; }); llSave(); renderLying(); toast("Removed from lying list"); };
    });
  }

  var hb=$("ll_hist") ? $("ll_hist").querySelector("tbody") : null;
  if(hb){
    hb.innerHTML = LL.cleared.length ? "" : '<tr><td colspan="6" style="text-align:center;color:var(--mut)">Nothing cleared yet.</td></tr>';
    LL.cleared.slice(0,100).forEach(function(it){
      hb.insertAdjacentHTML("beforeend",
        '<tr style="color:var(--mut)"><td>'+fmtDT(it.clearedAt)+'</td><td>'+esc(it.awb)+'</td><td>'+it.pcs+'</td>'
        +'<td class="n">'+money(it.wt)+'</td><td>'+esc(it.fltno)+'</td><td>'+fmtDT(it.dep)+'</td></tr>');
    });
  }
  var totW=0, totP=0; LL.items.forEach(function(x){ totW+=num(x.wt); totP+=num(x.pcs); });
  var sumEl=$("ll_sum"); if(sumEl) sumEl.innerHTML = LL.items.length+" shipments lying &nbsp;|&nbsp; "+totP+" pcs &nbsp;|&nbsp; "+money(totW)+" kg";
  var alertEl=$("ll_alerts"); if(alertEl) alertEl.innerHTML = LL.items.filter(function(x){ return (new Date(x.dep).getTime()-Date.now())/3600000 < 8; })
    .map(function(x){ return '<div class="alert warn"><b>'+esc(x.awb)+'</b>&nbsp; departing within '+llCountdown(x.dep)+' ('+esc(x.fltno)+')</div>'; }).join("");
}

function trimAwb(s){ return String(s||"").trim().replace(/[^0-9-]/g,""); }

function secAdd(awb, dir, by){
  DB.sec = DB.sec || [];
  DB.sec.push({ id:"SEC"+Date.now()+"_"+Math.floor(Math.random()*10000), awb:awb, dir:dir, by:by||"", ts:new Date().toISOString(), ack:false });
  DB.sec.sort(function(a,b){ if(a.dir!==b.dir) return a.dir<b.dir?-1:1; return b.ts-a.ts; });
  save(); renderSecurity();
}

function addOneAwb(){
  var awb=trimAwb($("#sec_awb").value);
  var dir=$("#sec_dir").value;
  var by=$("#sec_by").value.trim();
  if(!awb){ toast("Paste an AWB first","err"); return; }
  if(secFind(awb, dir)){ toast(awb+" is already on the reception list","warn"); $("#sec_awb").value=""; $("#sec_awb").focus(); return; }
  secAdd(awb, dir, by);
  $("#sec_awb").value=""; $("#sec_awb").focus();
}

function loadSample(){
  if(!confirm("Fill the reception list with sample cargo so you can test the missing-invoice alerts?")) return;
  var samples = [
    {awb:"780-31000001", dir:"Export", by:"ACC"},
    {awb:"780-31000002", dir:"Export", by:"WH"},
    {awb:"780-31000003", dir:"Import", by:"ACC"},
    {awb:"780-31000004", dir:"Import", by:"ACC"},
    {awb:"780-31000005", dir:"Import", by:"WH"}
  ];
  samples.forEach(function(s){ secAdd(s.awb, s.dir, s.by); });
  toast("Sample reception loaded ("+samples.length+" AWBs)","ok");
}

function backupSecurity(){
  var data = DB.sec || [];
  var blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = window.URL.createObjectURL(blob);
  a.download = "solitair-security-"+new Date().toISOString().slice(0,10)+".json";
  a.click();
}

function restoreSecurity(){
  var f = document.createElement("input");
  f.type="file"; f.accept=".json";
  f.onchange = function(){
    if(!f.files[0]) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var data = JSON.parse(r.result);
        if(!Array.isArray(data)){ toast("That file is not a security list","err"); return; }
        DB.sec = data; save(); renderSecurity();
        toast("Security list restored from file ("+data.length+" AWBs)");
      }catch(e){ toast("Could not read that file","err"); }
    };
    r.readAsText(f.files[0]);
  };
  f.click();
}

function secFind(awb, dir){
  var list = DB.sec||[];
  return list.some(function(x){ return x.ack===false && x.awb===AWB_CASE(awb) && x.dir===dir; });
}
function AWB_CASE(s){ return String(s||"").trim().toUpperCase(); }

function renderSecurity(){
  var secTblEl = $("sec_tbl"); var tbl = secTblEl ? secTblEl.querySelector("tbody") : null; if(!tbl) return;
  var fdir = $("#sec_dirfilter").value||"";

  var list = (DB.sec||[]).filter(function(x){ return x.ack===false; });
  if(fdir) list = list.filter(function(x){ return x.dir===fdir; });
  list = list.sort(function(a,b){ if(a.dir!==b.dir) return a.dir<b.dir?-1:1; return b.ts-a.ts; });

  if(!list.length){
    tbl.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--mut);padding:14px">No reception records yet. Receive cargo and add the AWB above to track it here.</td></tr>';
  } else {
    tbl.innerHTML = list.map(function(x){
      var inv = { exp:null, imp:null };
      var match = findInvoiceByAWB(x.awb);
      if(match){
        if(match.mode==="Export") inv.exp = match; else inv.imp = match;
      }
      var sold = inv.exp || inv.imp;
      var statusTxt, cls;
      if(sold){
        statusTxt = '<span class="tick">Invoiced</span> <span style="font-size:10px;color:var(--mut)">'+sold.ref+'</span>';
        cls = "paychk ok";
      } else {
        statusTxt = '<span class="cross" style="color:#dc2626;font-weight:700">NOT INVOICED</span>';
        cls = "paychk bad";
      }
      return '<tr data-id="'+esc(x.id)+'">'
        + '<td><b>'+esc(x.awb)+'</b></td>'
        + '<td><span class="badge '+(x.dir==="Export"?"b-exp":"b-imp")+'">'+esc(x.dir)+'</span></td>'
        + '<td>'+fmtDT(x.ts)+'</td>'
        + '<td>'+esc(x.by)+'</td>'
        + '<td><span class="'+cls+'" style="display:block;font-size:10.5px;font-weight:700">'+statusTxt+'</span></td>'
        + '<td><button class="btn sm dgr secrm" data-id="'+esc(x.id)+'" title="Delete this record">×</button></td>'
        + '</tr>';
    }).join("");
    $$("[data-id]", tbl).forEach(function(tr){
      var b = tr.querySelectorAll(".secrm");
      if(!b.length) return;
      b[0].onclick = function(){
        var rid = b[0].getAttribute("data-id");
        var row = (DB.sec||[]).filter(function(x){ return x.id===rid; })[0];
        if(!row) return;
        modal("Delete reception record?",
          "<p>Remove <b>"+esc(row.awb)+"</b> ("+esc(row.dir)+") from the reception list? This cannot be undone.</p>",
          [{label:"Cancel"},{label:"Delete", cls:"dgr", fn:function(){
            DB.sec = (DB.sec||[]).filter(function(x){ return x.id!==rid; });
            save(); renderSecurity();
            toast("Reception record deleted", "ok");
          }}]);
      };
    });
  }

  /* missing invoice alert */
  var missing = [];
  var dirw = { Export:{dir:"Export", inv:"Export", label:"Export"}, Import:{dir:"Import", inv:"Import", label:"Import"} };
  list.forEach(function(x){
    if(!findInvoiceByAWB(x.awb)){
      missing.push({ awb:x.awb, dir:x.dir, by:x.by, ts:x.ts });
    }
  });
  if(missing.length){
    $("#sec_missingpanel").style.display = "";
    $("#sec_missing").innerHTML = '<div class="alert err" style="margin-bottom:10px">'
      + '<b>ALERT: '+missing.length+' AWB(s) received but no invoice on the register yet.</b> '
      + 'Check with cargo acceptance before closing the shift.</div>'
      + '<table class="reg"><thead><tr><th>AWB #</th><th>Flow</th><th>Received At</th><th>Status</th></tr></thead><tbody>'
      + missing.map(function(m){
        return '<tr><td><b>'+esc(m.awb)+'</b></td>'
          + '<td><span class="badge '+(m.dir==="Export"?"b-exp":"b-imp")+'">'+esc(m.dir)+'</span></td>'
          + '<td>'+fmtDT(m.ts)+'</td>'
          + '<td><span class="paychk bad">NOT INVOICED</span></td>'
          + '</tr>';
      }).join("")
      + '</tbody></table>';
  } else {
    $("#sec_missingpanel").style.display = "none";
  }
}

function findInvoiceByAWB(awb){
  var hay = AWB_CASE(awb);
  var best = null;
  DB.entries.forEach(function(e){
    if(e.type!=="invoice") return;
    if(AWB_CASE(e.mawb)===hay){
      if(!best || e.ts > best.ts) best = e;
    }
  });
  return best;
}

function scanMissing(){
  var list = DB.sec ? DB.sec.filter(function(x){ return x.ack===false; }) : [];
  var byDir = { Export:[], Import:[] };
  list.forEach(function(x){ byDir[x.dir].push(x.awb); });

  var expMiss = byDir.Export.length ? byDir.Export.filter(function(a){ return !findInvoiceByAWB(a); }).length : 0;
  var impMiss = byDir.Import.length ? byDir.Import.filter(function(a){ return !findInvoiceByAWB(a); }).length : 0;

  var html = '<div class="alert info" style="margin-bottom:8px">'
    + '<b>Scan complete.</b> '+list.length+' AWBs on reception list. '
    + '<span class="tick">Invoiced:</span> '+(list.length - expMiss - impMiss)
    + ' &nbsp;&nbsp; <span class="cross" style="color:#dc2626;font-weight:700">Missing invoice:</span> '+(expMiss+impMiss)+'</div>';

  if(byDir.Export.length){
    html += '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;padding:8px 12px;margin-bottom:8px">'
      + '<span class="badge b-exp" style="margin-right:8px">Export</span><b>'+byDir.Export.length+' AWB(s)</b> | '
      + '<span class="tick">Invoiced</span> '+(byDir.Export.length-expMiss)+' &nbsp;|&nbsp; '
      + '<span class="cross" style="color:#dc2626;font-weight:700">Missing</span> '+expMiss+'</div>';
  }
  if(byDir.Import.length){
    html += '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;padding:8px 12px">'
      + '<span class="badge b-imp" style="margin-right:8px">Import</span><b>'+byDir.Import.length+' AWB(s)</b> | '
      + '<span class="tick">Invoiced</span> '+(byDir.Import.length-impMiss)+' &nbsp;|&nbsp; '
      + '<span class="cross" style="color:#dc2626;font-weight:700">Missing</span> '+impMiss+'</div>';
  }

  $("#sec_alerts").innerHTML = html;
  renderSecurity();
}

function ackSelected(){
  var secTblEl2 = $("sec_tbl"); var tbl = secTblEl2 ? secTblEl2.querySelector("tbody") : null;
  var rows = $$("tr[data-id]", tbl);
  var n = 0;
  rows.forEach(function(tr){
    var rid = tr.getAttribute("data-id");
    var row = (DB.sec||[]).filter(function(x){ return x.id===rid; })[0];
    if(row && !row.ack){
      row.ack = true; n++;
    }
  });
  if(n){ save(); renderSecurity(); toast(n+" record(s) cleared / acknowledged","ok"); }
  else toast("No records selected", "warn");
}

function addBlock(){
  var text = $("#sec_block").value || "";
  var dir = $("#sec_dir").value;
  var by   = $("#sec_by").value.trim();
  var lines = text.split(/\r?\n/).map(function(s){ return trimAwb(s); }).filter(Boolean);
  if(!lines.length){ toast("Paste at least one AWB","err"); return; }

  var added=0, skip=0;
  /* detect the direction from the labels so a big import batch can be added
     without re-picking Export every time - here we trust the explicit dir */
  lines.forEach(function(awb){
    if(secFind(awb, dir)) skip++;
    else { secAdd(awb, dir, by); added++; }
  });
  toast(added+" AWB(s) added; "+skip+" already on list (skipped)","ok");
  $("#sec_block").value="";
}

function confirmLookup(){
  var awb = trimAwb($("#sec_confirm_awb").value);
  if(!awb){ toast("Paste an AWB first","err"); return; }
  var inv = findInvoiceByAWB(awb);
  var d = $("#sec_confirm");
  if(!inv){
    d.innerHTML = '<div class="alert err"><b>'+esc(awb)+'</b> &mdash; <b>No invoice found on the register.</b></div>';
    return;
  }
  var pay = inv.payMode;
  var amt = typeof money!=="undefined" && money ? money(inv.total) : inv.total;
  d.innerHTML = '<div class="alert ok"><b>'+esc(awb)+'</b> &mdash; invoiced.</div>'
    + '<div style="padding:6px 0;font-size:12px">'
    + '<b>Ref:</b> '+esc(inv.ref)+'<br>'
    + '<b>Mode:</b> '+esc(inv.mode)+' &nbsp;|&nbsp; <b>Payment:</b> '+esc(pay)+' &nbsp;|&nbsp; <b>Total:</b> '+amp(amt)
    + '<br><b>Customer:</b> '+esc(inv.cust)+' &nbsp;|&nbsp; <b>Staff:</b> '+esc(inv.staff)+' &nbsp;|&nbsp; <b>Date:</b> '+fmtD(inv.date)+'</div>';
}

function amp(n){ return typeof money!=="undefined" && money ? money(n) : n; }

/* ============================================================
   15. BOOT
   ============================================================ */

function fillStaff(){
  var s=$("staff");
  if(!s) return;
  s.innerHTML = CFG.staff.map(function(x){ return '<option'+(x===DB.staff?' selected':'')+'>'+esc(x)+'</option>'; }).join("");
  if(!DB.staff){ DB.staff = CFG.staff[0]; }
  s.value = DB.staff;
  s.onchange = function(){
    DB.staff = s.value; save();
    var eo=$("#export_officer"), io=$("#import_officer");
    if(eo) eo.value=DB.staff; if(io) io.value=DB.staff;
    toast("Signed in as "+DB.staff);
  };
}

function applyLogo(){
  var img=$("brandLogo"), txt=$("brandText");
  if(img){
    img.src = DB.logo || LOGO_LIGHT;
    img.style.display = "block";
  }
  if(txt){
    txt.innerHTML = '<span>Imports/Exports</span>';
    txt.style.display = "block";
  }
}

/* Site details (tax registration, bank accounts) are configuration, not code.
   They are entered once per counter machine under Rates & Data and stored with
   that browser's data, so they never reach source control. */
function applySiteOverrides(){
  if(DB.company){
    if(DB.company.trn)     CFG.company.trn     = DB.company.trn;
    if(DB.company.contact) CFG.company.contact = DB.company.contact;
    if(DB.company.name)    CFG.company.name    = DB.company.name;
    if(DB.company.addr)    CFG.company.addr    = DB.company.addr;
  }
  if(DB.bank){
    if(DB.bank.aed && DB.bank.aed.length) CFG.bank.aed = DB.bank.aed;
    if(DB.bank.usd && DB.bank.usd.length) CFG.bank.usd = DB.bank.usd;
  }
}

function boot(){
  applySiteOverrides();
  if(DB.staffList && DB.staffList.length) CFG.staff = DB.staffList;
  if(DB.freeHours){ CFG.freeHours.general = DB.freeHours.general; CFG.freeHours.special = DB.freeHours.general; CFG.freeHours.perishable = DB.freeHours.perishable; }
  applyRateOverrides();
  applyLogo();
  seedCustomers();          // populate DB.customers from the 1,892-customer master
  refreshCustList();
  fillStaff();
  shLoad();
  buildShipments();
  buildCustomers();
  buildAdvice("export");
  buildAdvice("import");
  llLoad();
  buildLying();
  buildRegister();
  buildHandover();
  buildDash();
  buildAdmin();
  buildSecurity();
  refreshChip();
}

$$(".tabs button").forEach(function(b){
  b.onclick = function(){
    $$(".tabs button").forEach(function(x){ x.classList.remove("on"); });
    b.classList.add("on");
    $$(".page").forEach(function(p){ p.classList.remove("on"); });
    $("#p-"+b.dataset.p).classList.add("on");
    if(b.dataset.p==="dash") renderDash();
    if(b.dataset.p==="handover") renderHandover();
    if(b.dataset.p==="register") renderRegister();
    if(b.dataset.p==="lying") renderLying();
  };
});

/* lying list: refresh countdowns and sweep departed flights every 30s */
setInterval(function(){
  if($("#ll_tbl")) renderLying();
}, 30000);

/* keyboard: Ctrl+S saves the visible advice, Ctrl+P prints */
document.addEventListener("keydown", function(ev){
  if((ev.ctrlKey||ev.metaKey) && ev.key.toLowerCase()==="s"){
    var pg = $(".page.on");
    if(pg && (pg.id==="p-export"||pg.id==="p-import")){
      ev.preventDefault(); saveAdvice(pg.id==="p-export"?"export":"import");
    }
  }
  if(ev.key==="Escape") closeModal();
});

load();
/* day-first date fields, for every date input any builder puts on the page */
new MutationObserver(uaeDateFields).observe(document.body, {childList:true, subtree:true});
boot();
uaeDateFields();
