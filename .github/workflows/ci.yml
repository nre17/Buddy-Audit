name: CI

on:
  push:
    branches: [main, 'audit/**', 'codex/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned package manager
        run: npm install --global pnpm@11.19.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify application
        run: pnpm verify
      - name: Check reproducible demo master
        run: |
          python3 tools/generate-customers.py > /tmp/customers.demo.json
          diff -q fixtures/customers.demo.json /tmp/customers.demo.json
      - name: Block runtime data and generated output
        shell: bash
        run: |
          if git ls-files | grep -iE '^(\.data|data|dist)/|\.backup\.json$|SolitAir_(Invoicing_Backup|Workspace|Security)_.*\.json$|\.(csv|tsv|xlsx|xls)$'; then
            echo 'Runtime data, backups, manifests and generated builds must stay outside commits.'
            exit 1
          fi
